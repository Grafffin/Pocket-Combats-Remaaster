<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141a">
  <title>Pocket Combats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Создание персонажа -->
    <section id="create" class="screen" hidden>
      <header class="topbar"><div class="brand"><img src="assets/ui/logo.svg" alt="" onerror="this.remove()"><span>Pocket Combats</span></div></header>
      <div class="scroll pad">
        <h2 class="h">Новый герой</h2>
        <div class="field">
          <label for="nick">Имя</label>
          <div class="row">
            <input id="nick" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Например, Гарик">
            <div class="seg" id="gender"><button data-g="m">М</button><button data-g="f">Ж</button></div>
          </div>
        </div>
        <div class="field">
          <label>Класс</label>
          <div id="jobs" class="class-grid"></div>
        </div>
      </div>
      <footer class="bottombar"><button id="create-btn" class="btn primary wide">Начать путь</button></footer>
    </section>

    <!-- Основной экран: шапка, вкладки, навигация -->
    <section id="hub" class="screen" hidden>
      <header class="topbar hero-bar" id="hero-bar"></header>
      <main class="scroll" id="hub-body">
        <div id="tab-world" class="tab"></div>
        <div id="tab-hero" class="tab" hidden></div>
        <div id="tab-bag" class="tab" hidden></div>
        <div id="tab-forge" class="tab" hidden></div>
      </main>
      <nav class="tabs" id="tabs">
        <button data-tab="world"><img src="assets/ui/slots/feet.svg" alt="" onerror="this.remove()"><span>Мир</span></button>
        <button data-tab="hero"><img src="assets/ui/slots/head.svg" alt="" onerror="this.remove()"><span>Герой</span><i class="dot-badge" id="badge-hero" hidden></i></button>
        <button data-tab="bag"><img src="assets/ui/slots/body.svg" alt="" onerror="this.remove()"><span>Сумка</span><i class="dot-badge" id="badge-bag" hidden></i></button>
        <button data-tab="menu" class="menu-btn"><span class="burger"><i></i><i></i><i></i></span><span>Меню</span></button>
      </nav>
    </section>

    <!-- Бой -->
    <section id="battle" class="screen battle" hidden>
      <header class="topbar">
        <button class="icon-btn" id="leave" title="Сбежать" aria-label="Сбежать из боя">←</button>
        <h1 id="turn-title">Ход 1</h1>
        <span class="tick-label" id="tick-label"></span>
        <div class="battle-toggles">
          <button class="chip-btn" id="auto-btn" title="Автобой">Автобой</button>
          <button class="chip-btn icon" id="auto-settings" title="Настройки автобоя и охоты"><img src="assets/ui/gear.svg" alt="" onerror="this.outerHTML='⚙'"></button>
        </div>
      </header>
      <div class="arena" id="arena">
        <div class="fighter ally" id="f-p"></div>
        <div class="vs">VS</div>
        <div class="fighter foe" id="f-m"></div>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="turnbar" id="turnbar"><div class="fill" id="turn-fill"></div><i class="mark" id="turn-mark" title="Здесь ударит противник"></i><span class="txt" id="turn-txt"></span></div>
      <footer class="skillbar" id="skillbar"></footer>
    </section>
  </div>

  <!-- Нижняя шторка -->
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <h2 id="sheet-title"></h2>
      <div id="sheet-body"></div>
    </div>
  </div>

  <!-- Окно по центру экрана: предметы, ресурсы, подтверждения -->
  <div class="modal-wrap" id="modal" hidden>
    <div class="modal-backdrop" data-mclose></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h2 id="modal-title"></h2><div class="modal-tools" id="modal-tools"></div>
        <button class="icon-btn modal-x" data-mclose aria-label="Закрыть"><img src="assets/ui/close.svg" alt="" onerror="this.outerHTML='✕'"></button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Итог боя -->
  <div class="result" id="result" hidden>
    <div class="result-card">
      <div class="result-banner" id="result-banner"></div>
      <div class="result-body" id="result-body"></div>
      <div class="result-actions">
        <button class="btn primary" id="again">Ещё бой</button>
        <button class="btn" id="to-camp">К локации</button>
      </div>
    </div>
  </div>

  <!-- Вход и регистрация -->
  <div class="auth" id="auth" hidden>
    <div class="auth-card">
      <div class="auth-hero">
        <div class="auth-emblem"><svg viewBox="0 0 48 48" fill="none" stroke="#f0c46a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 5 8 11v12c0 11 7 17 16 20 9-3 16-9 16-20V11L24 5Z" fill="rgba(217,164,65,.12)"/><path d="m16 32 16-16m0 0h-6m6 0v6M32 32 16 16m0 0h6m-6 0v6"/></svg></div>
        <h1>Pocket Combats</h1>
        <p>Войдите, чтобы видеть других игроков и сохранять героя</p>
      </div>
      <div class="auth-panel card">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="on" id="auth-tab-login" role="tab">Вход</button>
          <button type="button" id="auth-tab-register" role="tab">Регистрация</button>
        </div>
        <form id="auth-form" novalidate>
          <div class="auth-field" id="auth-nick-field" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><input id="auth-nick" placeholder="Ник героя" maxlength="16" autocomplete="nickname" spellcheck="false" aria-label="Ник"></div>
          <div class="auth-field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="auth-email" type="email" placeholder="Почта" autocomplete="email" inputmode="email" aria-label="Почта"></div>
          <div class="auth-field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="auth-pass" type="password" placeholder="Пароль" autocomplete="current-password" aria-label="Пароль"><button type="button" class="auth-eye" id="auth-eye" aria-label="Показать пароль"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <p class="auth-msg" id="auth-msg" aria-live="polite"></p>
          <button class="btn primary wide" id="auth-submit" type="submit">Войти</button>
        </form>
        <div class="auth-or"><span>или</span></div>
        <button class="btn wide" id="auth-guest" type="button">Играть гостем</button>
      </div>
      <button class="auth-link" id="auth-offline" type="button">Играть офлайн без входа</button>
    </div>
  </div>
  </div>

  <!-- Всплывающие сообщения -->
  <div class="toasts" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/version.js"></script>
  <script src="js/data.js"></script>
  <script src="js/classes.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/items-data.js"></script>
  <script src="js/monsters.js"></script>
  <script src="js/world-data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/items.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/world.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/lockstep.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/item-ui.js"></script>
  <script src="js/battle-ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/bag-ui.js"></script>
  <script src="js/forge-ui.js"></script>
  <script src="js/market-ui.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/presence.js"></script>
  <script src="js/battles.js"></script>
  <script src="js/worldsync.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
