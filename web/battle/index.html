  <div class="app">
    <!-- Подготовка к бою -->
    <!-- Создание персонажа -->
    <section id="create" class="screen" hidden>
      <header class="bar"><h1>Pocket Combats <small>новый персонаж</small></h1></header>
      <div class="setup-body">
        <div class="field">
          <label for="nick">Имя персонажа</label>
          <div class="row">
            <input id="nick" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Например, Гарик">
            <div class="seg" id="gender">
              <button data-g="m">М</button><button data-g="f">Ж</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Класс</label>
          <div id="jobs" class="cards"></div>
        </div>
      </div>
      <footer class="actions"><button id="create-btn" class="btn primary wide">Создать персонажа</button></footer>
    </section>

    <!-- Лагерь -->
    <section id="hub" class="screen" hidden>
      <header class="bar hub-head">
        <div class="hub-who">
          <h1 id="hub-name"></h1>
          <div class="meta" id="hub-sub"></div>
        </div>
        <div class="hub-exp">
          <div class="exp-bar"><div id="hub-exp-fill"></div></div>
          <div class="meta" id="hub-exp-text"></div>
        </div>
      </header>
      <div class="hub-body" id="hub-body">
        <div id="tab-loc"></div>
        <div id="tab-char" hidden></div>
        <div id="tab-gear" hidden></div>
      </div>
      <nav class="tabs">
        <button data-tab="loc">Локация</button>
        <button data-tab="char">Персонаж <span class="badge" id="tab-char-badge" hidden></span></button>
        <button data-tab="gear">Снаряжение</button>
      </nav>
    </section>

    <!-- Бой -->
    <section id="battle" class="screen" hidden>
      <header class="bar">
        <button class="icon-btn" id="leave" title="Сбежать из боя" aria-label="Сбежать из боя">←</button>
        <h1 id="turn-title">Ход 1</h1>
        <span id="timer-text" class="timer-text"></span>
        <div class="timer"><div id="timer-fill"></div></div>
      </header>

      <div class="fighters">
        <div class="fighter ally" id="f-p"></div>
        <div class="vs">vs</div>
        <div class="fighter foe" id="f-m"></div>
      </div>

      <div class="tactics" id="tactics"></div>

      <div class="log" id="log" aria-live="polite"></div>

      <footer class="actions">
        <button class="btn primary" id="act-basic">Обычный удар</button>
        <button class="btn" id="act-skills">Приёмы <span class="badge" id="skills-badge" hidden></span></button>
        <button class="btn" id="act-items" title="Зелья">Зелья</button>
      </footer>
    </section>
  </div>

  <!-- Нижняя шторка: приёмы, зелья, подсказки -->
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <h2 id="sheet-title"></h2>
      <div id="sheet-body"></div>
    </div>
  </div>

  <!-- Итог боя -->
  <div class="result" id="result" hidden>
    <div class="result-card">
      <div class="result-banner" id="result-banner"></div>
      <div class="result-body" id="result-body"></div>
      <div class="result-actions">
        <button class="btn primary" id="again">Ещё бой</button>
        <button class="btn" id="to-camp">К локации</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/world-data.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/battle-ui.js"></script>
  <script src="js/hub.js"></script>
</body>
</html>
